# Paste inside the `server { ... }` block of the reverse proxy.
# Requires BASE_PATH=/chess/ and the shared Docker network (see .env.example).
#
# Also needs this once at http level (outside `server { }`, e.g. at the top of
# the same conf.d file) for the WebSocket upgrade:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

location = /chess {
    return 301 /chess/;
}

location /chess/ {
    # Docker's DNS plus a variable: nginx still starts (and keeps serving other
    # sites) while the gambit container is down.
    resolver 127.0.0.11 valid=10s;
    set $gambit http://gambit:4173;

    # No path after the port: the /chess/ prefix must reach the app unchanged.
    proxy_pass $gambit;

    # Online play: WebSocket at /chess/ws. Keep idle sockets open (the server
    # pings every 25 s) and do not buffer.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
